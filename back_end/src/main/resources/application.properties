spring.application.name=kinetix
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Mantem false como padrao para campos booleanos opcionais nos formularios existentes.
spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.datasource.url=${KINETIX_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Kinetix;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${KINETIX_DB_USERNAME:sa}
spring.datasource.password=${KINETIX_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

kinetix.security.jwt.secret-base64=${KINETIX_JWT_SECRET_BASE64:}
kinetix.security.jwt.ttl=PT8H
kinetix.data.encryption-key=${KINETIX_DATA_ENCRYPTION_KEY:}
kinetix.time-zone=${KINETIX_TIME_ZONE:America/Sao_Paulo}
kinetix.push.expo-url=https://exp.host/--/api/v2/push/send

# SMTP: configure no .env. Mailpit local usa 127.0.0.1:1025.
spring.mail.host=${KINETIX_SMTP_HOST:}
spring.mail.port=${KINETIX_SMTP_PORT:587}
spring.mail.username=${KINETIX_SMTP_USERNAME:}
spring.mail.password=${KINETIX_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${KINETIX_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${KINETIX_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${KINETIX_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
