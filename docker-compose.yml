services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kinetix-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Kinetix@12345"
      MSSQL_PID: "Developer"
    ports:
      - "${KINETIX_SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kinetix@12345 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kinetix-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - "-S"
      - "sqlserver"
      - "-U"
      - "sa"
      - "-P"
      - "Kinetix@12345"
      - "-C"
      - "-b"
      - "-Q"
      - "IF DB_ID(N'Kinetix') IS NULL EXEC(N'CREATE DATABASE [Kinetix]');"
    restart: "no"

  backend:
    image: maven:3.9.11-eclipse-temurin-21
    container_name: kinetix-backend
    working_dir: /app
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      KINETIX_DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=Kinetix;encrypt=true;trustServerCertificate=true"
      KINETIX_DB_USERNAME: "sa"
      KINETIX_DB_PASSWORD: "Kinetix@12345"
      KINETIX_JWT_SECRET_BASE64: "S2luZXRpeEp3dFNlY3JldEtleV8yMDI2XzMyYnl0ZXM="
      KINETIX_DATA_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      KINETIX_WEB_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
    volumes:
      - ./back_end:/app
      - backend-maven-cache:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8080:8080"

  web:
    image: node:22-alpine
    container_name: kinetix-web
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: "http://backend:8080"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  sqlserver-data:
  web-node-modules:
  backend-maven-cache:
